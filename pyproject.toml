[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ayatulkursi"
version = "1.0.2"
description = "Production-ready Python CLI application for playing Ayatul Kursi audio in the background"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "nawaz0x1", email = "nawaz0x1@example.com"}
]
keywords = ["ayatul-kursi", "audio", "player", "cli", "background"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Utilities",
]

dependencies = [
    "pygame>=2.1.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "isort>=5.12",
]

[project.scripts]
ayatulkursi = "ayatulkursi.cli:main"

[project.urls]
Homepage = "https://github.com/nawaz0x1/ayatulkursi"
Documentation = "https://github.com/nawaz0x1/ayatulkursi#readme"
Repository = "https://github.com/nawaz0x1/ayatulkursi.git"
Issues = "https://github.com/nawaz0x1/ayatulkursi/issues"

[tool.setuptools]
packages = ["ayatulkursi"]

[tool.setuptools.package-data]
ayatulkursi = ["assets/*"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=ayatulkursi --cov-report=html --cov-report=term-missing"
